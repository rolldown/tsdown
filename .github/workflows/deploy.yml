# This file is generated by actionspack. Do not edit it manually.

name: Deploy

permissions: {}

on:
  push:
    branches:
      - release
    paths:
      - docs/**
      - src/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - .github/workflows/src/deploy.yml
      - .github/workflows/deploy.yml

jobs:
  deploy-void:
    name: Deploy to Void
    if: github.repository == 'rolldown/tsdown'
    runs-on: ubuntu-latest
    environment: void
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: '1'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: pnpm
          package-manager-cache: true
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: pnpm
          NO_FROZEN_LOCKFILE: ''
        run: $PACKAGE_MANAGER install $NO_FROZEN_LOCKFILE

      - run: pnpm run docs:generate

      - run: pnpm -C docs run void deploy
        env:
          VOID_PROJECT: tsdown
