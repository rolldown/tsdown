# This file is generated by actionspack. Do not edit it manually.

name: Publish Any Commit

on:
  - push
  - pull_request

permissions: {}

jobs:
  release-release:
    name: Release Commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: '1'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: pnpm
          package-manager-cache: true
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: pnpm
          NO_FROZEN_LOCKFILE: ''
        run: $PACKAGE_MANAGER install $NO_FROZEN_LOCKFILE

      - name: Build
        run: pnpm run build

      - name: Publish
        run: pnpm dlx pkg-pr-new@0.0 publish --pnpm --compact . './packages/*' --packageManager=pnpm,npm,yarn --commentWithDev
