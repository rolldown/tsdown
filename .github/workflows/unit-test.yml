# This file is generated by actionspack. Do not edit it manually.

name: Unit Test

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-test-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: '1'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: lts/*
          cache: pnpm
          package-manager-cache: true
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: pnpm
          NO_FROZEN_LOCKFILE: ''
        run: $PACKAGE_MANAGER install $NO_FROZEN_LOCKFILE

      - name: Type Check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

  unit-test-test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 22
          - 24
          - 26
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: '1'

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          package-manager-cache: true
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        shell: bash
        env:
          PACKAGE_MANAGER: pnpm
          NO_FROZEN_LOCKFILE: ''
        run: $PACKAGE_MANAGER install $NO_FROZEN_LOCKFILE

      - name: Build
        run: pnpm run build

      - name: Unit Test
        run: pnpm run test
